<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Страница Регистрации</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container">
    <div class="register-section">
        <h1>Регистрация</h1>
        <input type="text" placeholder="Имя">
        <input type="email" id="email" placeholder="E-mail"> 
        <input type="password" placeholder="Пароль">
        <input type="password" placeholder="Подтвердите пароль">
        <a href="#">Уже есть аккаунт? Войти</a>
        <button id="register-btn">Зарегистрироваться</button>
    </div>
    <div class="image-section">
    </div>
</div>

<!-- Pop-up окно -->
<div id="popup" class="popup hidden">
    <div class="popup-content">
        <p>На e-mail <span id="user-email"></span> был выслан код для подтверждения аккаунта</p>
        <input type="text" id="confirmation-code" placeholder="Введите код">
        <button id="confirm-btn">Подтвердить</button>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
