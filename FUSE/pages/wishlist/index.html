<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Избранное</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
    <nav class="navbar">
        <img src="..\..\assets\svg\logo.svg" alt="Essencia Logo" class="logo">
        <div class="nav-icons">
            <img src="..\..\assets\svg\user.svg" alt="User Icon">
            <img src="..\..\assets\svg\wishlist.svg" alt="Wishlist Icon">
            <img src="..\..\assets\svg\cart.svg" alt="Cart Icon">
        </div>
    </nav>
</header>

<main>
    <section class="favorites">
        <h2>Мои избранные товары</h2>
        <div class="favorites-grid">
            <div class="favorites-card">
                <div class="favorites-image" style="background-image: url('/path/to/image1.jpg');"></div>
                <div class="favorites-info">
                    <h3>Название товара</h3>
                    <p class="category">Категория</p>
                    <span class="price">570 ₽</span>
                    <button class="remove-btn">Удалить из избранного</button>
                </div>
            </div>
            <!-- Добавьте больше товаров по аналогии -->
        </div>
    </section>
</main>

</body>
</html>
