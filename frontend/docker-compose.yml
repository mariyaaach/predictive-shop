version: '3.9'

services:
  streamlit_frontend:
      build:
        context: .
        dockerfile: Dockerfile
      container_name: streamlit_frontend
      working_dir: /app
      environment:
        - URL_USERS=http://backend:8000
        - URL_PRODUCTS=http://products_backend:8001
        - URL_ORDERS=http://orders_backend:8002
      depends_on:
        - backend
        - products_backend
        - orders_backend
      volumes:
        - ./app:/app
      ports:
        - "8501:8501"
      networks:
        - shared
