version: '3.9'

services:
  backend:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: fastapi_backend
    ports:
      - "8000:8000"
    environment: 
      #Нада менять под нашу бд
      DATABASE_URL: postgresql+asyncpg://login:password@db:5432/name_bd
    depends_on:
      - db

  db:
    image: postgres:15
    #И тута
    container_name: postgres_db
    environment:
      POSTGRES_USER: login
      POSTGRES_PASSWORD: password
      POSTGRES_DB: name_bd
    ports:
      - "5433:5433"
    volumes:
      - db_data:/var/lib/postgresql/data 

volumes:
  db_data:
